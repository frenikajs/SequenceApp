<svg xmlns="http://www.w3.org/2000/svg" width="480" height="210" viewBox="0 0 480 210">
  <!-- Repeatable haunted-graveyard silhouette: a crooked manor with glowing
       windows, dead trees, tombstones and an iron fence. -->
  <g fill="#150c24">
    <!-- dead tree left -->
    <path d="M28 210 L24 120 C22 100 8 96 10 78 C16 90 22 86 24 74 C26 92 30 92 34 80 C34 96 44 100 40 116 L36 210 Z"/>
    <!-- tombstones -->
    <path d="M60 210 v-46 a14 14 0 0 1 28 0 v46 Z"/>
    <path d="M300 210 v-38 a12 12 0 0 1 24 0 v38 Z"/>
    <rect x="350" y="178" width="26" height="32" rx="3"/>
    <!-- haunted manor -->
    <rect x="120" y="96" width="120" height="114"/>
    <polygon points="112,99 150,52 188,99"/>
    <polygon points="172,99 210,58 248,99"/>
    <rect x="236" y="70" width="22" height="140"/>
    <polygon points="232,72 247,40 262,72"/>
    <!-- dead tree right -->
    <path d="M430 210 L426 116 C424 96 410 92 412 74 C418 86 424 82 426 70 C428 88 432 88 436 76 C436 92 446 96 442 112 L438 210 Z"/>
  </g>
  <!-- glowing windows + door -->
  <g>
    <rect x="134" y="112" width="20" height="26" rx="2" fill="#ffae42"/>
    <rect x="172" y="112" width="20" height="26" rx="2" fill="#9acd32"/>
    <rect x="206" y="112" width="20" height="26" rx="2" fill="#ffae42"/>
    <rect x="240" y="92" width="14" height="20" rx="2" fill="#9acd32"/>
    <rect x="160" y="160" width="34" height="50" rx="3" fill="#ff8c1a"/>
    <rect x="168" y="172" width="18" height="38" fill="#150c24"/>
  </g>
  <!-- iron fence -->
  <g fill="#0e0719">
    <rect x="0" y="186" width="480" height="6"/>
    <rect x="6" y="172" width="5" height="24"/><rect x="34" y="172" width="5" height="24"/>
    <rect x="62" y="172" width="5" height="24"/><rect x="90" y="172" width="5" height="24"/>
    <rect x="270" y="172" width="5" height="24"/><rect x="298" y="172" width="5" height="24"/>
    <rect x="326" y="172" width="5" height="24"/><rect x="392" y="172" width="5" height="24"/>
    <rect x="420" y="172" width="5" height="24"/><rect x="448" y="172" width="5" height="24"/>
  </g>
</svg>
